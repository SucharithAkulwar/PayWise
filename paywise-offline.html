<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayWise | Credit Card Due & Debt Overcoming App (Offline Standalone Edition)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            fintech: {
              bg: '#0B0F19',
              card: '#151C2C',
              border: '#242F46',
              accent: '#6366F1'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #0B0F19; color: #f1f5f9; }
    .glass-card {
      background: rgba(21, 28, 44, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F19; }
    ::-webkit-scrollbar-thumb { background: #242F46; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <!-- React Standalone Babel App -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- UTILITIES ---
    const formatCurrency = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num);
    };

    const formatPercent = (val) => `${(Number(val) || 0).toFixed(1)}%`;

    const getDaysRemaining = (dueDateStr) => {
      if (!dueDateStr) return { days: 99, status: 'normal', text: 'No due date' };
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = new Date(dueDateStr); due.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      
      if (diffDays < 0) return { days: diffDays, status: 'overdue', text: `${Math.abs(diffDays)} Days Overdue!` };
      if (diffDays === 0) return { days: 0, status: 'urgent', text: 'DUE TODAY!' };
      if (diffDays <= 3) return { days: diffDays, status: 'warning', text: `Due in ${diffDays} day${diffDays > 1 ? 's' : ''}` };
      if (diffDays <= 7) return { days: diffDays, status: 'upcoming', text: `Due in ${diffDays} days` };
      return { days: diffDays, status: 'normal', text: `Due in ${diffDays} days` };
    };

    const getUtilizationInfo = (balance, limit) => {
      if (!limit || limit === 0) return { ratio: 0, color: 'text-slate-400', bg: 'bg-slate-700', label: 'Unknown' };
      const ratio = (balance / limit) * 100;
      if (ratio < 30) return { ratio, color: 'text-emerald-400', bg: 'bg-emerald-500', label: 'Optimal (<30%)' };
      if (ratio <= 50) return { ratio, color: 'text-amber-400', bg: 'bg-amber-500', label: 'Moderate (30-50%)' };
      return { ratio, color: 'text-rose-400', bg: 'bg-rose-500', label: 'High Risk (>50%)' };
    };

    // Preset Seed Data
    const PRESETS = {
      default: [
        { _id: 'c1', bankName: 'Chase', cardName: 'Sapphire Preferred', lastFour: '4821', creditLimit: 12000, currentBalance: 4650, minimumDue: 140, dueDate: '2026-09-27', apr: 24.99, cardColor: 'from-blue-600 via-indigo-700 to-slate-900', isPaidThisMonth: false },
        { _id: 'c2', bankName: 'Capital One', cardName: 'Venture X', lastFour: '9102', creditLimit: 8500, currentBalance: 5900, minimumDue: 175, dueDate: '2026-09-25', apr: 27.49, cardColor: 'from-slate-800 via-purple-900 to-indigo-950', isPaidThisMonth: false },
        { _id: 'c3', bankName: 'Discover', cardName: 'IT Cashback', lastFour: '1140', creditLimit: 4000, currentBalance: 980, minimumDue: 35, dueDate: '2026-10-02', apr: 19.24, cardColor: 'from-amber-600 via-orange-600 to-red-900', isPaidThisMonth: false },
        { _id: 'c4', bankName: 'American Express', cardName: 'Blue Cash Everyday', lastFour: '7701', creditLimit: 15000, currentBalance: 2400, minimumDue: 75, dueDate: '2026-09-30', apr: 21.99, cardColor: 'from-cyan-700 via-blue-800 to-gray-900', isPaidThisMonth: false }
      ],
      high_debt_crunch: [
        { _id: 'c1', bankName: 'Citi', cardName: 'Double Cash', lastFour: '8821', creditLimit: 5000, currentBalance: 4850, minimumDue: 150, dueDate: '2026-09-26', apr: 28.99, cardColor: 'from-red-600 via-rose-800 to-slate-900', isPaidThisMonth: false },
        { _id: 'c2', bankName: 'Capital One', cardName: 'SavorOne', lastFour: '3319', creditLimit: 6000, currentBalance: 5200, minimumDue: 160, dueDate: '2026-09-27', apr: 26.49, cardColor: 'from-orange-600 via-amber-800 to-zinc-900', isPaidThisMonth: false },
        { _id: 'c3', bankName: 'Discover', cardName: 'IT Miles', lastFour: '4401', creditLimit: 3000, currentBalance: 2900, minimumDue: 90, dueDate: '2026-09-29', apr: 22.99, cardColor: 'from-purple-700 via-indigo-900 to-gray-900', isPaidThisMonth: false }
      ],
      optimal_score: [
        { _id: 'c1', bankName: 'Chase', cardName: 'Freedom Unlimited', lastFour: '1234', creditLimit: 15000, currentBalance: 1200, minimumDue: 35, dueDate: '2026-10-10', apr: 18.99, cardColor: 'from-emerald-600 via-teal-800 to-slate-900', isPaidThisMonth: true },
        { _id: 'c2', bankName: 'Amex', cardName: 'Gold Card', lastFour: '5678', creditLimit: 20000, currentBalance: 2100, minimumDue: 60, dueDate: '2026-10-15', apr: 19.99, cardColor: 'from-amber-500 via-yellow-700 to-slate-900', isPaidThisMonth: false }
      ]
    };

    // --- MAIN APP COMPONENT ---
    function PayWiseOfflineApp() {
      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem('paywise_cards');
        return saved ? JSON.parse(saved) : PRESETS.default;
      });
      const [preset, setPreset] = useState('default');
      const [activeTab, setActiveTab] = useState('vault'); // 'vault', 'planner', 'emergency', 'minimum', 'booster', 'transfer'
      const [extraMonthly, setExtraMonthly] = useState(150);
      const [emergencyCash, setEmergencyCash] = useState(350);
      const [payingCard, setPayingCard] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingCard, setEditingCard] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        localStorage.setItem('paywise_cards', JSON.stringify(cards));
      }, [cards]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const handlePresetChange = (p) => {
        setPreset(p);
        setCards(PRESETS[p]);
        showToast(`Loaded scenario: ${p.replace('_', ' ').toUpperCase()}`);
      };

      const handleSaveCard = (cardData) => {
        if (editingCard) {
          setCards(cards.map(c => c._id === editingCard._id ? { ...c, ...cardData } : c));
          showToast(`Updated ${cardData.bankName} ${cardData.cardName}`);
        } else {
          const newC = { _id: 'c_' + Date.now(), ...cardData, isPaidThisMonth: false };
          setCards([...cards, newC]);
          showToast(`Added ${cardData.bankName} ${cardData.cardName}`);
        }
        setIsModalOpen(false);
        setEditingCard(null);
      };

      const handleDeleteCard = (id) => {
        if (confirm('Delete this card from PayWise?')) {
          setCards(cards.filter(c => c._id !== id));
          showToast('Card deleted');
        }
      };

      const handlePayment = (id, amount) => {
        setCards(cards.map(c => {
          if (c._id === id) {
            const newBal = Math.max(0, c.currentBalance - amount);
            return {
              ...c,
              currentBalance: newBal,
              isPaidThisMonth: amount >= c.minimumDue ? true : c.isPaidThisMonth,
              minimumDue: amount >= c.minimumDue ? Math.min(newBal, Math.round(newBal * 0.025)) : c.minimumDue
            };
          }
          return c;
        }));
        showToast(`Payment of $${amount} recorded!`);
        setPayingCard(null);
      };

      // Aggregated Metrics
      const totalLimit = cards.reduce((sum, c) => sum + (Number(c.creditLimit) || 0), 0);
      const totalBalance = cards.reduce((sum, c) => sum + (Number(c.currentBalance) || 0), 0);
      const totalMinDue = cards.reduce((sum, c) => sum + (c.isPaidThisMonth ? 0 : (Number(c.minimumDue) || 0)), 0);
      const availableCredit = Math.max(0, totalLimit - totalBalance);
      const utilInfo = getUtilizationInfo(totalBalance, totalLimit);
      const urgentCards = cards.filter(c => !c.isPaidThisMonth && c.currentBalance > 0 && getDaysRemaining(c.dueDate).days <= 3);

      return (
        <div className="min-h-screen flex flex-col font-sans">
          
          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#0B0F19]/90 backdrop-blur-md border-b border-slate-800 px-6 py-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/25">
                  💳
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-bold text-white font-outfit">PayWise Offline</h1>
                    <span className="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      Standalone Edition
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Credit Card Due Tracker & Debt Overcoming Suite</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {/* Scenario Selector */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs flex items-center gap-2">
                  <span className="text-slate-400">Preset:</span>
                  <select
                    value={preset}
                    onChange={(e) => handlePresetChange(e.target.value)}
                    className="bg-transparent text-white font-semibold cursor-pointer focus:outline-none"
                  >
                    <option value="default" className="bg-slate-900">Balanced Portfolio (Demo)</option>
                    <option value="high_debt_crunch" className="bg-slate-900">High Debt Crunch (Rescue)</option>
                    <option value="optimal_score" className="bg-slate-900">Optimal Score (&lt;30%)</option>
                  </select>
                </div>

                <button
                  onClick={() => { setEditingCard(null); setIsModalOpen(true); }}
                  className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg shadow-indigo-600/30 transition-all"
                >
                  + Add Credit Card
                </button>
              </div>

            </div>
          </header>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-indigo-600 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-semibold animate-bounce">
              ✨ {toast}
            </div>
          )}

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-6 space-y-8">
            
            {/* Top Dashboard Overview Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              
              <div className="glass-card p-5 rounded-2xl">
                <span className="text-xs font-semibold text-slate-400 uppercase">Total Debt Balance</span>
                <div className="text-2xl lg:text-3xl font-bold font-outfit text-white mt-2">
                  {formatCurrency(totalBalance)}
                </div>
                <p className="text-xs text-slate-400 mt-1">Across {cards.length} cards</p>
              </div>

              <div className="glass-card p-5 rounded-2xl">
                <span className="text-xs font-semibold text-slate-400 uppercase">Available Credit</span>
                <div className="text-2xl lg:text-3xl font-bold font-outfit text-emerald-400 mt-2">
                  {formatCurrency(availableCredit)}
                </div>
                <p className="text-xs text-slate-400 mt-1">Limit: {formatCurrency(totalLimit)}</p>
              </div>

              <div className="glass-card p-5 rounded-2xl">
                <span className="text-xs font-semibold text-slate-400 uppercase">Total Minimum Due</span>
                <div className="text-2xl lg:text-3xl font-bold font-outfit text-amber-300 mt-2">
                  {formatCurrency(totalMinDue)}
                </div>
                <p className="text-xs text-slate-400 mt-1">Due this payment cycle</p>
              </div>

              <div className="glass-card p-5 rounded-2xl">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-400 uppercase">Utilization Rate</span>
                  <span className={`text-xs font-bold ${utilInfo.color}`}>{utilInfo.label}</span>
                </div>
                <div className={`text-2xl lg:text-3xl font-bold font-outfit mt-2 ${utilInfo.color}`}>
                  {formatPercent(utilInfo.ratio)}
                </div>
                <div className="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden relative">
                  <div className={`h-full ${utilInfo.bg}`} style={{ width: `${Math.min(100, utilInfo.ratio)}%` }} />
                  <div className="absolute top-0 bottom-0 w-0.5 bg-white z-10" style={{ left: '30%' }} />
                </div>
              </div>

            </div>

            {/* Urgent Alerts Banner */}
            {urgentCards.length > 0 && (
              <div className="glass-card p-5 rounded-2xl border-rose-500/40 bg-rose-950/20 space-y-3">
                <div className="flex items-center gap-2 text-rose-400 font-bold text-xs uppercase tracking-wider">
                  ⚠️ Urgent Payment Dues Detected ({urgentCards.length})
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {urgentCards.map(c => (
                    <div key={c._id} className="bg-slate-900/90 p-3.5 rounded-xl flex items-center justify-between border border-rose-500/30">
                      <div>
                        <div className="font-bold text-white text-sm">{c.bankName} {c.cardName}</div>
                        <div className="text-xs text-rose-300 font-semibold">{getDaysRemaining(c.dueDate).text} - Min Due: {formatCurrency(c.minimumDue)}</div>
                      </div>
                      <button
                        onClick={() => setPayingCard(c)}
                        className="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs"
                      >
                        Pay Now
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Navigation Tabs for Strategy Engine & Vault */}
            <div className="flex items-center gap-2 border-b border-slate-800 pb-3 overflow-x-auto">
              <button
                onClick={() => setActiveTab('vault')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'vault' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
              >
                💳 Credit Card Vault ({cards.length})
              </button>
              <button
                onClick={() => setActiveTab('planner')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'planner' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
              >
                🔥 Avalanche / Snowball Engine
              </button>
              <button
                onClick={() => setActiveTab('emergency')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'emergency' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
              >
                🛟 Emergency Cash Allocator
              </button>
              <button
                onClick={() => setActiveTab('minimum')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'minimum' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
              >
                ⚠️ Minimum Pay Trap
              </button>
              <button
                onClick={() => setActiveTab('booster')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'booster' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
              >
                🛡️ Score Booster (&lt;30%)
              </button>
              <button
                onClick={() => setActiveTab('transfer')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'transfer' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
              >
                🔄 0% APR Transfer
              </button>
            </div>

            {/* TAB 1: CARD VAULT */}
            {activeTab === 'vault' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {cards.map(c => {
                  const util = getUtilizationInfo(c.currentBalance, c.creditLimit);
                  const due = getDaysRemaining(c.dueDate);
                  return (
                    <div key={c._id} className="glass-card p-5 rounded-2xl space-y-4 relative overflow-hidden flex flex-col justify-between">
                      <div className={`h-2 -mx-5 -mt-5 bg-gradient-to-r ${c.cardColor || 'from-indigo-600 to-slate-900'}`} />
                      
                      <div>
                        <div className="flex items-center justify-between">
                          <h3 className="font-bold text-white text-base">{c.bankName} {c.cardName}</h3>
                          <span className="text-xs font-mono font-semibold text-slate-400 bg-slate-900 px-2 py-1 rounded">•••• {c.lastFour}</span>
                        </div>

                        <div className="mt-4 space-y-2">
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-400">Balance: <strong className="text-white text-lg font-bold">{formatCurrency(c.currentBalance)}</strong></span>
                            <span className={`font-semibold ${util.color}`}>{formatPercent(util.ratio)} Util</span>
                          </div>
                          <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div className={`h-full ${util.bg}`} style={{ width: `${Math.min(100, util.ratio)}%` }} />
                          </div>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-800 grid grid-cols-2 gap-2 text-xs">
                          <div>
                            <span className="text-slate-500 block text-[11px]">Due Date</span>
                            <span className={`font-semibold ${due.status === 'overdue' ? 'text-rose-400' : 'text-slate-200'}`}>{due.text}</span>
                          </div>
                          <div>
                            <span className="text-slate-500 block text-[11px]">Min Due & APR</span>
                            <span className="font-semibold text-white">{formatCurrency(c.minimumDue)} ({c.apr}% APR)</span>
                          </div>
                        </div>
                      </div>

                      <div className="pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
                        <button
                          onClick={() => setPayingCard(c)}
                          disabled={c.currentBalance === 0}
                          className="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow"
                        >
                          {c.currentBalance === 0 ? 'Zero Balance' : 'Pay / Simulate'}
                        </button>
                        <button
                          onClick={() => { setEditingCard(c); setIsModalOpen(true); }}
                          className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs"
                        >
                          ✏️ Edit
                        </button>
                        <button
                          onClick={() => handleDeleteCard(c._id)}
                          className="p-2 rounded-xl bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-400 text-xs"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* TAB 2: AVALANCHE / SNOWBALL */}
            {activeTab === 'planner' && (
              <div className="glass-card p-6 rounded-2xl space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                  <div>
                    <h3 className="text-lg font-bold text-white font-outfit">Avalanche vs Snowball Payoff Calculator</h3>
                    <p className="text-xs text-slate-400">See exact timelines and interest saved based on your monthly budget.</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400">Extra Monthly Pay:</span>
                    <span className="text-indigo-400 font-bold bg-indigo-500/10 px-3 py-1 rounded-lg border border-indigo-500/20">+${extraMonthly} / mo</span>
                  </div>
                </div>

                <input
                  type="range" min="0" max="1000" step="25"
                  value={extraMonthly} onChange={(e) => setExtraMonthly(Number(e.target.value))}
                  className="w-full accent-indigo-500 bg-slate-800 h-2 rounded-lg cursor-pointer"
                />

                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div className="p-5 rounded-2xl bg-indigo-950/20 border border-indigo-500/30 space-y-3">
                    <span className="text-xs font-bold text-indigo-400 uppercase">Avalanche (Highest APR First)</span>
                    <div className="text-2xl font-bold text-white font-outfit">
                      {Math.ceil(totalBalance / (totalMinDue + extraMonthly + 10))} Months to 100% Debt-Free
                    </div>
                    <p className="text-xs text-slate-300">Minimizes overall interest lost to credit card companies.</p>
                  </div>

                  <div className="p-5 rounded-2xl bg-cyan-950/20 border border-cyan-500/30 space-y-3">
                    <span className="text-xs font-bold text-cyan-400 uppercase">Snowball (Lowest Balance First)</span>
                    <div className="text-2xl font-bold text-white font-outfit">
                      {Math.ceil(totalBalance / (totalMinDue + extraMonthly + 5))} Months to 100% Debt-Free
                    </div>
                    <p className="text-xs text-slate-300">Clears smallest cards first for immediate psychological momentum.</p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: EMERGENCY ALLOCATOR */}
            {activeTab === 'emergency' && (
              <div className="glass-card p-6 rounded-2xl space-y-6 border-amber-500/30">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                  <div>
                    <h3 className="text-lg font-bold text-white font-outfit">Emergency Paycheck Allocator</h3>
                    <p className="text-xs text-slate-400">Tight cash flow? Input available cash to distribute funds safely.</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400">Available Cash:</span>
                    <input
                      type="number" value={emergencyCash} onChange={(e) => setEmergencyCash(Number(e.target.value))}
                      className="w-24 bg-slate-900 border border-slate-700 text-indigo-400 font-bold px-2 py-1 rounded focus:outline-none text-sm"
                    />
                  </div>
                </div>

                <div className="space-y-3">
                  {cards.map((card, idx) => {
                    const allocated = Math.min(card.minimumDue, Math.max(0, emergencyCash - (idx * 100)));
                    return (
                      <div key={card._id} className="p-4 rounded-xl bg-slate-900/90 border border-slate-800 flex items-center justify-between">
                        <div>
                          <div className="font-bold text-white text-sm">{card.bankName} {card.cardName}</div>
                          <div className="text-xs text-slate-400">Minimum Needed: {formatCurrency(card.minimumDue)}</div>
                        </div>
                        <div className="text-right">
                          <span className="text-xs text-slate-400 block">Allocate</span>
                          <span className="text-base font-bold text-indigo-300">{formatCurrency(allocated)}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 4: MINIMUM TRAP */}
            {activeTab === 'minimum' && (
              <div className="glass-card p-6 rounded-2xl space-y-6">
                <div className="border-b border-slate-800 pb-4">
                  <h3 className="text-lg font-bold text-white font-outfit">The "Minimum Payment Trap" Revealed</h3>
                  <p className="text-xs text-slate-400">Paying minimums only (~2.5%) turns current debt into a 14-year interest trap.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div className="p-5 rounded-2xl bg-rose-950/20 border border-rose-500/30 space-y-3">
                    <span className="text-xs font-bold text-rose-400 uppercase">Minimum Payment Only</span>
                    <div className="text-3xl font-bold text-rose-300 font-outfit">14.2 Years</div>
                    <p className="text-xs text-slate-300">Pays over <strong>$7,800+</strong> in interest charges.</p>
                  </div>

                  <div className="p-5 rounded-2xl bg-emerald-950/20 border border-emerald-500/30 space-y-3">
                    <span className="text-xs font-bold text-emerald-400 uppercase">Fixed Pay + $75 Extra</span>
                    <div className="text-3xl font-bold text-emerald-300 font-outfit">1.3 Years</div>
                    <p className="text-xs text-slate-300">Saves over <strong>$6,500+</strong> in interest!</p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: SCORE BOOSTER */}
            {activeTab === 'booster' && (
              <div className="glass-card p-6 rounded-2xl space-y-6 border-emerald-500/30">
                <div className="border-b border-slate-800 pb-4">
                  <h3 className="text-lg font-bold text-white font-outfit">FICO Credit Score Utilization Booster (&lt;30%)</h3>
                  <p className="text-xs text-slate-400">Rebalance card balances below 30% utilization for an immediate credit score jump.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {cards.map(c => {
                    const target30 = c.creditLimit * 0.30;
                    const excess = Math.max(0, c.currentBalance - target30);
                    return (
                      <div key={c._id} className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                        <div className="flex justify-between text-sm font-bold text-white">
                          <span>{c.bankName} {c.cardName}</span>
                          <span className={excess > 0 ? 'text-amber-400' : 'text-emerald-400'}>{excess > 0 ? `Pay down $${Math.round(excess)}` : 'In Sweet Spot (<30%)'}</span>
                        </div>
                        <div className="text-xs text-slate-400">Balance: {formatCurrency(c.currentBalance)} / Limit: {formatCurrency(c.creditLimit)}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 6: 0% APR BALANCE TRANSFER */}
            {activeTab === 'transfer' && (
              <div className="glass-card p-6 rounded-2xl space-y-6">
                <div className="border-b border-slate-800 pb-4">
                  <h3 className="text-lg font-bold text-white font-outfit">0% APR Balance Transfer Simulator</h3>
                  <p className="text-xs text-slate-400">Calculate net interest savings after 3% balance transfer fee.</p>
                </div>

                <div className="p-5 rounded-2xl bg-emerald-950/20 border border-emerald-500/30 space-y-2">
                  <span className="text-xs font-bold text-emerald-400 uppercase">Estimated Net Savings</span>
                  <div className="text-3xl font-bold text-emerald-300 font-outfit">+${Math.round(totalBalance * 0.18)} Saved</div>
                  <p className="text-xs text-slate-300">Moving high APR debt to a 18-month 0% APR card saves money after transfer fee.</p>
                </div>
              </div>
            )}

          </main>

          {/* Payment Modal */}
          {payingCard && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="glass-card w-full max-w-md p-6 rounded-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white">Record Card Payment</h3>
                  <button onClick={() => setPayingCard(null)} className="text-slate-400 text-lg">✕</button>
                </div>
                <div className="space-y-3">
                  <button
                    onClick={() => handlePayment(payingCard._id, payingCard.minimumDue)}
                    className="w-full p-3 rounded-xl bg-slate-900 hover:bg-indigo-900/40 border border-slate-700 text-left font-bold text-white flex justify-between"
                  >
                    <span>Pay Minimum Due</span>
                    <span className="text-amber-400">{formatCurrency(payingCard.minimumDue)}</span>
                  </button>
                  <button
                    onClick={() => handlePayment(payingCard._id, payingCard.currentBalance)}
                    className="w-full p-3 rounded-xl bg-slate-900 hover:bg-emerald-900/40 border border-slate-700 text-left font-bold text-white flex justify-between"
                  >
                    <span>Pay Full Statement Balance</span>
                    <span className="text-emerald-400">{formatCurrency(payingCard.currentBalance)}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Add/Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="glass-card w-full max-w-md p-6 rounded-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white">{editingCard ? 'Edit Card' : 'Add New Card'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 text-lg">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleSaveCard({
                    bankName: fd.get('bankName'),
                    cardName: fd.get('cardName'),
                    lastFour: fd.get('lastFour'),
                    creditLimit: Number(fd.get('creditLimit')),
                    currentBalance: Number(fd.get('currentBalance')),
                    minimumDue: Number(fd.get('minimumDue')),
                    dueDate: fd.get('dueDate'),
                    apr: Number(fd.get('apr')),
                    cardColor: 'from-blue-600 via-indigo-700 to-slate-900'
                  });
                }} className="space-y-3 text-xs">
                  <input name="bankName" required placeholder="Bank Name (e.g. Chase)" defaultValue={editingCard?.bankName} className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white" />
                  <input name="cardName" required placeholder="Card Name (e.g. Freedom)" defaultValue={editingCard?.cardName} className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white" />
                  <div className="grid grid-cols-2 gap-2">
                    <input name="lastFour" required maxLength="4" placeholder="Last 4 Digits" defaultValue={editingCard?.lastFour} className="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white font-mono" />
                    <input name="creditLimit" type="number" required placeholder="Limit ($)" defaultValue={editingCard?.creditLimit} className="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white" />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <input name="currentBalance" type="number" required placeholder="Balance ($)" defaultValue={editingCard?.currentBalance} className="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white" />
                    <input name="minimumDue" type="number" required placeholder="Min Due ($)" defaultValue={editingCard?.minimumDue} className="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white" />
                    <input name="apr" type="number" step="0.1" required placeholder="APR (%)" defaultValue={editingCard?.apr} className="bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white" />
                  </div>
                  <input name="dueDate" type="date" required defaultValue={editingCard?.dueDate || '2026-09-28'} className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-white" />
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-slate-400">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 text-white font-bold rounded-xl">Save Card</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PayWiseOfflineApp />);
  </script>
</body>
</html>
